# Self-hosted LiveKit SFU configuration for CP Chat (production)
# Secrets are injected via LIVEKIT_KEYS="${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
# from .env — never hardcode API keys or secrets in this file.

port: 7880
bind_addresses:
  - "0.0.0.0" # Restrict :7880 at host firewall (UFW deny 7880/tcp); reachable via reverse proxy & Docker host-gateway

rtc:
  port_range_start: 50000
  port_range_end: 60000
  tcp_port: 7881
  use_external_ip: true
  enable_loopback_candidate: false

redis:
  address: 127.0.0.1:6379
  db: 1

room:
  auto_create: false       # Only backend RoomServiceClient.createRoom opens rooms
  empty_timeout: 45        # Auto-close unanswered 1:1 / empty rooms after 45s
  departure_timeout: 20    # Close room 20s after last participant leaves

turn:
  enabled: true
  domain: turn.cpchat.example.com
  tls_port: 5349
  udp_port: 3478
  cert_file: /etc/letsencrypt/live/turn.cpchat.example.com/fullchain.pem
  key_file: /etc/letsencrypt/live/turn.cpchat.example.com/privkey.pem
  external_tls: false

webhook:
  api_key: ""
  urls:
    - http://127.0.0.1:8080/api/v1/webhooks/livekit

logging:
  level: info
  pion_level: warn
