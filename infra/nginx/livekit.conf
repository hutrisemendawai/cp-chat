# Reference Nginx reverse proxy config for self-hosted LiveKit + webhook isolation.
# Co-locate with the main API/Gateway Nginx config described in docs/gateway-scaling.md.
#
# Required host firewall rules (UFW):
#   sudo ufw allow 443/tcp
#   sudo ufw allow 7881/tcp
#   sudo ufw allow 5349/tcp
#   sudo ufw allow 3478/udp
#   sudo ufw allow 50000:60000/udp
#   sudo ufw deny 7880/tcp

server {
    listen 443 ssl http2;
    server_name livekit.cpchat.example.com;

    ssl_certificate     /etc/letsencrypt/live/livekit.cpchat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.cpchat.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# Include this location block inside the main api.cpchat.example.com server block
# so LiveKit webhooks are only accepted over loopback from the local LiveKit server.
