name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cpchat
          POSTGRES_PASSWORD: cpchat
          POSTGRES_DB: cpchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cpchat -d cpchat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cpchat:cpchat@localhost:5432/cpchat?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config -q

      - name: Install golang-migrate
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz \
            | tar xz -C "$HOME/.local/bin" migrate
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply migrations
        run: migrate -path backend/migrations -database "$DATABASE_URL" up

      - name: Verify schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT table_name FROM information_schema.tables
          WHERE table_schema = 'public'
          ORDER BY table_name;
          SELECT conname FROM pg_constraint
          WHERE conname IN ('messages_conversation_id_seq_key', 'messages_sender_id_client_msg_id_key');
          SQL

      - name: Verify migrations roll back cleanly
        run: |
          migrate -path backend/migrations -database "$DATABASE_URL" down -all
          migrate -path backend/migrations -database "$DATABASE_URL" up

  contracts:
    name: Contracts (OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate OpenAPI spec
        run: npx --yes @apidevtools/swagger-cli@4 validate docs/api-spec.yaml

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate Drift code
        working-directory: mobile
        run: dart run build_runner build

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug
