openapi: 3.0.3
info:
  title: CP Chat REST API
  version: 0.1.0
  description: |
    REST contract for the CP Chat Android client and backend services.

    Realtime traffic (message send/receive, delivery and read receipts, presence)
    is handled by the WebSocket gateway — see `docs/ws-protocol.md`.

    All endpoints are versioned under `/api/v1`. Authenticated endpoints require
    `Authorization: Bearer <access_token>`.
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.cpchat.example.com
    description: Production

tags:
  - name: Auth
  - name: Users
  - name: Conversations
  - name: Messages
  - name: Devices
  - name: Media
  - name: Presence
  - name: Search
  - name: Encryption
  - name: Logging

paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created and tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in with phone/email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New token pair (refresh tokens are rotated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '204':
          description: Token revoked

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      description: >
        Returns the caller's real presence preference (`status`, which may be
        `invisible`) plus `effective_status` (what peers currently see). Until
        the user opens a gateway socket the effective status is `offline`.
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Users]
      summary: Update the authenticated user's profile
      description: >
        Omit a field to leave it unchanged; send `null` to clear `nickname`,
        `avatar_url`, `custom_status` or `bio`. An empty nickname/custom status
        is normalised to null. Changing `status` or `custom_status` broadcasts a
        `presence` frame to every user who shares a conversation with the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Users]
      summary: Get another user's public profile
      description: >
        Returns the public profile with presence. An `invisible` user is always
        reported as `offline`; the raw preference never leaks. `phone_or_email`
        is included so app users can identify contacts by email before a chat
        exists.
      responses:
        '200':
          description: Public profile with presence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/devices/fcm-token:
    post:
      tags: [Devices]
      summary: Register or refresh the Android FCM device token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcm_token]
              properties:
                fcm_token:
                  type: string
                device_id:
                  type: string
                  description: Stable per-install identifier
      responses:
        '204':
          description: Token stored

  /api/v1/conversations:
    get:
      tags: [Conversations]
      summary: List conversations with unread counts
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: before
          in: query
          description: Cursor (conversation `id`) for pagination
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Conversation list ordered by last activity
          content:
            application/json:
              schema:
                type: object
                required: [conversations]
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                  next_cursor:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Conversations]
      summary: Create a direct or group conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Conversations]
      summary: Get a conversation with members
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Conversations]
      summary: Update a group name or avatar (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                avatar_url:
                  type: string
                  nullable: true
                  description: Object key returned by the media service
      responses:
        '200':
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/conversations/{id}/members:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Conversations]
      summary: Add members to a group (admin only, max 500 members)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Updated member list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Group is already at the 500-member limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/conversations/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Conversations]
      summary: Remove a member or leave the group
      description: >
        A member may remove themselves (leave). Removing another member requires
        admin. The last admin of a group with other members cannot leave until
        another admin is promoted. Removing the final member deletes the group.
      responses:
        '204':
          description: Member removed
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cannot remove the last admin of a non-empty group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Messages]
      summary: Fetch message history (newest first, backwards pagination)
      parameters:
        - name: before_seq
          in: query
          description: Return messages with `seq` strictly lower than this value
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Message page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/conversations/{id}/sync:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Messages]
      summary: Offline catch-up — all messages after the local cursor
      parameters:
        - name: after_seq
          in: query
          description: Return messages with `seq` greater than this value, ascending
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: Missed messages in ascending seq order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/media/presign:
    post:
      tags: [Media]
      summary: Get a pre-signed upload URL for images and files
      description: >
        Presigned URLs are signed against `S3_PUBLIC_ENDPOINT`, the storage host
        the client must be able to reach directly. Devices that cannot reach
        that host should use `POST /media/upload` instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content_type, size_bytes]
              properties:
                filename:
                  type: string
                content_type:
                  type: string
                  example: image/jpeg
                size_bytes:
                  type: integer
                  format: int64
                  maximum: 26214400
      responses:
        '201':
          description: Pre-signed upload target
          content:
            application/json:
              schema:
                type: object
                required: [media_id, object_key, upload_url, file_url, expires_at]
                properties:
                  media_id:
                    type: string
                    format: uuid
                  object_key:
                    type: string
                    description: >
                      Storage key to reference in a message `content` (media
                      messages) or a group `avatar_url`.
                  upload_url:
                    type: string
                    format: uri
                    description: >
                      Short-lived presigned PUT. Upload the bytes with the exact
                      `Content-Type` and `Content-Length` declared here.
                  file_url:
                    type: string
                    format: uri
                  content_type:
                    type: string
                  size_bytes:
                    type: integer
                    format: int64
                  expires_at:
                    type: string
                    format: date-time
        '413':
          description: File exceeds the 25 MB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content type not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/media/upload:
    post:
      tags: [Media]
      summary: Upload media bytes through the API
      description: >
        Uploads the file body directly to the API, which writes it to object
        storage server-side. Use this instead of `POST /media/presign` when the
        device can only reach the API host (e.g. a physical phone that cannot
        reach the MinIO/S3 endpoint). The bytes are sent as a raw body with the
        media type in `Content-Type` and an optional name in `x-filename`.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      parameters:
        - name: x-filename
          in: header
          required: false
          schema:
            type: string
          description: Original file name; drives the stored extension.
      responses:
        '201':
          description: Media stored
          content:
            application/json:
              schema:
                type: object
                required: [media_id, object_key, file_url, content_type, size_bytes]
                properties:
                  media_id:
                    type: string
                    format: uuid
                  object_key:
                    type: string
                    description: Reference this key in a message `content` or group `avatar_url`
                  file_url:
                    type: string
                    format: uri
                  content_type:
                    type: string
                  size_bytes:
                    type: integer
                    format: int64
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File exceeds the configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content type not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/media/{key}:
    get:
      tags: [Media]
      summary: Fetch a media object
      description: >
        Allowed for the owner, for users who share a conversation with the
        owner, and for any authenticated user when the key is referenced as a
        user avatar or a group avatar of a conversation they belong to, so
        profile photos load before a chat exists. By default the bytes are
        streamed through the API so a device only needs to reach the API host.
        Pass `proxy=0` to instead receive a `302` redirect to a short-lived
        presigned GET (for clients that can reach the storage host directly).
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: Object key returned by `POST /media/upload` or `POST /media/presign`
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: >
            Access token for image/download handlers that cannot set an
            `Authorization` header. A bearer header is preferred when possible.
        - name: proxy
          in: query
          required: false
          schema:
            type: boolean
          description: >
            Set to `0` to redirect to a presigned URL instead of streaming the
            bytes through the API.
      responses:
        '200':
          description: The media bytes, with `Content-Type` and `Cache-Control private, max-age=300`
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '302':
          description: Redirect to the presigned download URL (when `proxy=0`)
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/presence/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Presence]
      summary: Current visible status and last-seen time for a user
      description: >
        Online state is a Redis key with a 45 s TTL refreshed by the gateway
        heartbeat; `last_seen_at` is persisted when the user's last device
        disconnects. `status` is the effective visible Discord-style state: an
        `invisible` user reports `offline` and a connected `dnd` user reports
        `dnd`. Live changes after this call arrive as `presence` frames on the
        WebSocket.
      responses:
        '200':
          description: Presence snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Presence'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/search:
    get:
      tags: [Search]
      summary: Full-text search across every conversation the caller belongs to
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchLimit'
        - $ref: '#/components/parameters/SearchBeforeSeq'
      responses:
        '200':
          description: Ranked search hits, best match first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/conversations/{id}/search:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Search]
      summary: Full-text search inside one conversation
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchLimit'
        - $ref: '#/components/parameters/SearchBeforeSeq'
      responses:
        '200':
          description: Ranked search hits within the conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/keys:
    post:
      tags: [Encryption]
      summary: Publish this device's public encryption keys
      description: >
        Publishes the identity key, the Ed25519 signing key, one signed prekey,
        and up to 200 one-time prekeys. Only public material is accepted; the
        server never receives a private key. Re-publishing the identity key
        rotates it (peers see a new safety number). Re-uploading the same
        one-time prekey ids is a no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishKeysRequest'
      responses:
        '201':
          description: Keys stored
          content:
            application/json:
              schema:
                type: object
                required: [one_time_prekeys]
                properties:
                  one_time_prekeys:
                    type: integer
                    description: Count stored after this upload; replenish when low
                  added:
                    type: integer
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/keys/prekeys:
    post:
      tags: [Encryption]
      summary: Top up one-time prekeys
      description: >
        Adds one-time prekeys without re-publishing the identity or signed
        prekey. Existing key ids are ignored, so a retried upload is safe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [one_time_prekeys]
              properties:
                one_time_prekeys:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    $ref: '#/components/schemas/OneTimePrekey'
      responses:
        '200':
          description: Prekeys added
          content:
            application/json:
              schema:
                type: object
                required: [added, one_time_prekeys]
                properties:
                  added:
                    type: integer
                  one_time_prekeys:
                    type: integer
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/keys/me:
    get:
      tags: [Encryption]
      summary: The caller's own public key status
      responses:
        '200':
          description: Published keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                  identity_key:
                    type: string
                  signing_key:
                    type: string
                  one_time_prekeys:
                    type: integer
                  updated_at:
                    type: string
                    format: date-time
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Encryption]
      summary: Fetch a prekey bundle to start an E2EE session
      description: >
        Returns the recipient's identity key, signing key, signed prekey with its
        signature, and one one-time prekey when available. A one-time prekey is
        **consumed** by this call (deleted atomically), so the response is
        per-caller and un-cacheable (`Cache-Control: no-store`). A null
        `one_time_prekey` means the supply is exhausted; the signed prekey alone
        still works.
      responses:
        '200':
          description: Prekey bundle
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrekeyBundle'
        '404':
          description: The user has not published encryption keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/logs:
    get:
      tags: [Logging]
      summary: Query the recent log timeline
      description: >
        Returns entries from the shared Redis-backed buffer. The buffer has a
        hard 1-hour retention (`LOG_RETENTION_SECONDS`, capped at 3600) and is
        pruned before every response, so an entry older than one hour is never
        returned. Secret fields (authorization headers, passwords, refresh
        tokens, JWTs, message plaintext) are redacted at write time. When
        `LOG_VIEWER_TOKEN` is configured it must be presented as
        `Authorization: Bearer <token>` (or `?token=`); otherwise the endpoint is
        open on the LAN and a bearer access token is honoured when present.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/LogService'
        - $ref: '#/components/parameters/LogLevel'
        - $ref: '#/components/parameters/LogQuery'
        - $ref: '#/components/parameters/LogSince'
        - $ref: '#/components/parameters/LogLimit'
      responses:
        '200':
          description: Oldest-first window of the retained entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Logging]
      summary: Clear the log buffer
      description: Removes every buffered entry immediately. Useful between test runs.
      security:
        - bearerAuth: []
        - {}
      responses:
        '204':
          description: Buffer cleared
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/logs/stream:
    get:
      tags: [Logging]
      summary: Stream new log entries (Server-Sent Events)
      description: >
        `text/event-stream` endpoint. Emits each new entry as a `data:` frame and
        a `:keepalive` comment every 15 seconds. Entries arrive through Redis
        Pub/Sub (`cpchat:logs:live`), so a stream sees both `rest` and `gateway`
        output regardless of which process serves the request.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: token
          in: query
          description: Viewer token, for EventSource clients that cannot set headers.
          schema:
            type: string
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/logs/client:
    post:
      tags: [Logging]
      summary: Submit a mobile diagnostic entry
      description: >
        Lets the Flutter app forward `warn`/`error` diagnostics into the same
        timeline. The entry is tagged `service: mobile` and the caller's id;
        entries are capped at 4 KB and rate-limited per user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientLogRequest'
      responses:
        '202':
          description: Entry buffered
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Too many client log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /logs:
    get:
      tags: [Logging]
      summary: Live log monitoring dashboard
      description: >
        Self-contained HTML + vanilla JS dashboard (no external CDN assets) with
        service/level filter chips, keyword search, pause/resume auto-scroll, a
        clear button, and an `EventSource` live tail. It shows the retention
        badge (`Retention: 1 hour (auto-purge)`) and the current entry count.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: token
          in: query
          description: Viewer token, for opening the page in a browser.
          schema:
            type: string
      responses:
        '200':
          description: Dashboard HTML
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    LogService:
      name: service
      in: query
      description: Filter by emitting service
      schema:
        type: string
        enum: [rest, gateway, mobile]
    LogLevel:
      name: level
      in: query
      description: Minimum level (inclusive)
      schema:
        type: string
        enum: [debug, info, warn, error, fatal]
    LogQuery:
      name: q
      in: query
      description: Case-insensitive substring over message, path, user id and meta
      schema:
        type: string
    LogSince:
      name: since
      in: query
      description: Only entries at or after this time. Accepts epoch ms or an ISO timestamp.
      schema:
        type: string
    LogLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
    ConversationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SearchQuery:
      name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: >
        Search text. Uses PostgreSQL `websearch_to_tsquery` semantics, so quoted
        phrases, `or`, and a leading `-` for exclusion are supported.
    SearchLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    SearchBeforeSeq:
      name: before_seq
      in: query
      description: Return only messages with `seq` lower than this value
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    Unauthorized:
      description: Missing, expired or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Caller is not a member of this conversation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: invalid_credentials
            message:
              type: string
            details:
              type: object
              additionalProperties: true

    User:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        phone_or_email:
          type: string
          description: Included on the caller's own profile and on public profiles
        name:
          type: string
        nickname:
          type: string
          nullable: true
          maxLength: 60
          description: Optional handle rendered as "Name (nickname)"
        avatar_url:
          type: string
          nullable: true
          description: Object key returned by the media service
        status:
          type: string
          enum: [online, idle, dnd, invisible, offline]
          description: >
            On the caller's own profile, the real preference (including
            `invisible`). On another user's profile, the masked visible value
            (`invisible` is never returned).
        effective_status:
          type: string
          enum: [online, idle, dnd, offline]
          description: What peers currently see, derived from preference and connection
        custom_status:
          type: string
          nullable: true
          maxLength: 120
        bio:
          type: string
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    ProfileUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        nickname:
          type: string
          nullable: true
          maxLength: 60
        avatar_url:
          type: string
          nullable: true
          description: Object key returned by the media service; null clears it
        status:
          type: string
          enum: [online, idle, dnd, invisible]
        custom_status:
          type: string
          nullable: true
          maxLength: 120
        bio:
          type: string
          nullable: true

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Access token lifetime in seconds

    AuthResponse:
      type: object
      required: [user, access_token, refresh_token, expires_in]
      properties:
        user:
          $ref: '#/components/schemas/User'
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer

    RegisterRequest:
      type: object
      required: [phone_or_email, name, password]
      properties:
        phone_or_email:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [phone_or_email, password]
      properties:
        phone_or_email:
          type: string
        password:
          type: string

    Member:
      type: object
      required: [user, role]
      properties:
        user:
          $ref: '#/components/schemas/User'
        role:
          type: string
          enum: [admin, member]
        last_read_seq:
          type: integer
          format: int64
        joined_at:
          type: string
          format: date-time

    Conversation:
      type: object
      required: [id, type, members, unread_count, last_read_seq, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [direct, group]
        name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
          description: Group avatar object key (null for direct chats)
        created_by:
          type: string
          format: uuid
          nullable: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        last_message:
          allOf:
            - $ref: '#/components/schemas/Message'
          nullable: true
        last_read_seq:
          type: integer
          format: int64
        unread_count:
          type: integer
        created_at:
          type: string
          format: date-time

    CreateConversationRequest:
      type: object
      required: [type, member_ids]
      properties:
        type:
          type: string
          enum: [direct, group]
        name:
          type: string
          description: Required for groups
          maxLength: 100
        avatar_url:
          type: string
          nullable: true
          description: Optional group avatar object key
        member_ids:
          type: array
          minItems: 1
          maxItems: 499
          items:
            type: string
            format: uuid

    Message:
      type: object
      required: [id, conversation_id, seq, sender_id, client_msg_id, type, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
        sender_id:
          type: string
          format: uuid
        client_msg_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [text, image, file]
        content:
          type: string
          description: Text body, or the media URL/ID for image and file messages
        created_at:
          type: string
          format: date-time

    MessagePage:
      type: object
      required: [messages, has_more]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        has_more:
          type: boolean

    SyncResponse:
      type: object
      required: [messages, latest_seq]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: Ascending by seq
        latest_seq:
          type: integer
          format: int64
          description: Highest seq in the conversation; repeat sync when it exceeds the last returned message

    Presence:
      type: object
      required: [user_id, online]
      properties:
        user_id:
          type: string
          format: uuid
        online:
          type: boolean
          description: Backward-compatible alias for `status != "offline"`
        status:
          type: string
          enum: [online, idle, dnd, offline]
          description: >
            Effective visible status. An `invisible` user is reported as
            `offline`; a connected `dnd` user reports `dnd`.
        custom_status:
          type: string
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: Last disconnection time; null if the user has never disconnected

    SearchHit:
      allOf:
        - $ref: '#/components/schemas/Message'
        - type: object
          properties:
            rank:
              type: number
              format: double
              description: Relevance score from `ts_rank`; higher is a better match

    SearchResult:
      type: object
      required: [messages, has_more]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
          description: Ordered by rank descending, then seq descending
        has_more:
          type: boolean

    OneTimePrekey:
      type: object
      required: [key_id, public_key]
      properties:
        key_id:
          type: integer
          minimum: 1
        public_key:
          type: string
          description: Base64 X25519 public key

    PublishKeysRequest:
      type: object
      required: [identity_key, signing_key, signed_prekey]
      properties:
        identity_key:
          type: string
          description: Base64 X25519 identity public key
        signing_key:
          type: string
          description: Base64 Ed25519 public key that signs prekeys
        signed_prekey:
          type: object
          required: [key_id, public_key, signature]
          properties:
            key_id:
              type: integer
              minimum: 1
            public_key:
              type: string
            signature:
              type: string
              description: Ed25519 signature over the signed prekey bytes
        one_time_prekeys:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/OneTimePrekey'

    PrekeyBundle:
      type: object
      required: [user_id, identity_key, signing_key, signed_prekey, remaining_one_time_prekeys]
      properties:
        user_id:
          type: string
          format: uuid
        identity_key:
          type: string
        signing_key:
          type: string
        signed_prekey:
          type: object
          required: [key_id, public_key, signature]
          properties:
            key_id:
              type: integer
            public_key:
              type: string
            signature:
              type: string
        one_time_prekey:
          nullable: true
          description: Consumed by this fetch; null when the supply is exhausted
          type: object
          properties:
            key_id:
              type: integer
            public_key:
              type: string
        remaining_one_time_prekeys:
          type: integer

    LogEntry:
      type: object
      required: [id, ts, service, level, message]
      properties:
        id:
          type: string
          format: uuid
        ts:
          type: integer
          format: int64
          description: Unix epoch milliseconds
        service:
          type: string
          enum: [rest, gateway, mobile]
        level:
          type: string
          enum: [debug, info, warn, error, fatal]
        message:
          type: string
        user_id:
          type: string
          format: uuid
        req_id:
          type: string
        method:
          type: string
        path:
          type: string
        status_code:
          type: integer
        duration_ms:
          type: number
        meta:
          type: object
          additionalProperties: true
          description: Structured context, with secret keys replaced by `[redacted]`

    LogPage:
      type: object
      required: [logs, count, retention_seconds]
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        count:
          type: integer
          description: Total entries currently buffered (not just this page)
        retention_seconds:
          type: integer
          example: 3600
        viewer:
          type: object
          properties:
            retention_seconds:
              type: integer
            enabled:
              type: boolean

    ClientLogRequest:
      type: object
      required: [message]
      properties:
        level:
          type: string
          enum: [debug, info, warn, error, fatal]
          default: info
        tag:
          type: string
          maxLength: 80
        message:
          type: string
          minLength: 1
          maxLength: 2000
        meta:
          type: object
          additionalProperties: true
        ts:
          type: integer
          format: int64

security:
  - bearerAuth: []
