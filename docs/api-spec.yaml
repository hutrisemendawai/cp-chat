openapi: 3.0.3
info:
  title: CP Chat REST API
  version: 0.1.0
  description: |
    REST contract for the CP Chat Android client and backend services.

    Realtime traffic (message send/receive, delivery and read receipts, presence)
    is handled by the WebSocket gateway — see `docs/ws-protocol.md`.

    All endpoints are versioned under `/api/v1`. Authenticated endpoints require
    `Authorization: Bearer <access_token>`.
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.cpchat.example.com
    description: Production

tags:
  - name: Auth
  - name: Users
  - name: Conversations
  - name: Messages
  - name: Devices
  - name: Media
  - name: Presence
  - name: Search
  - name: Encryption

paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created and tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in with phone/email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New token pair (refresh tokens are rotated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '204':
          description: Token revoked

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/devices/fcm-token:
    post:
      tags: [Devices]
      summary: Register or refresh the Android FCM device token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcm_token]
              properties:
                fcm_token:
                  type: string
                device_id:
                  type: string
                  description: Stable per-install identifier
      responses:
        '204':
          description: Token stored

  /api/v1/conversations:
    get:
      tags: [Conversations]
      summary: List conversations with unread counts
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: before
          in: query
          description: Cursor (conversation `id`) for pagination
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Conversation list ordered by last activity
          content:
            application/json:
              schema:
                type: object
                required: [conversations]
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                  next_cursor:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Conversations]
      summary: Create a direct or group conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Conversations]
      summary: Get a conversation with members
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Conversations]
      summary: Update a group name or avatar (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                avatar_url:
                  type: string
                  nullable: true
                  description: Object key returned by the media service
      responses:
        '200':
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/conversations/{id}/members:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [Conversations]
      summary: Add members to a group (admin only, max 500 members)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Updated member list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Group is already at the 500-member limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/conversations/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Conversations]
      summary: Remove a member or leave the group
      description: >
        A member may remove themselves (leave). Removing another member requires
        admin. The last admin of a group with other members cannot leave until
        another admin is promoted. Removing the final member deletes the group.
      responses:
        '204':
          description: Member removed
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cannot remove the last admin of a non-empty group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Messages]
      summary: Fetch message history (newest first, backwards pagination)
      parameters:
        - name: before_seq
          in: query
          description: Return messages with `seq` strictly lower than this value
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Message page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/conversations/{id}/sync:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Messages]
      summary: Offline catch-up — all messages after the local cursor
      parameters:
        - name: after_seq
          in: query
          description: Return messages with `seq` greater than this value, ascending
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: Missed messages in ascending seq order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/media/presign:
    post:
      tags: [Media]
      summary: Get a pre-signed upload URL for images and files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content_type, size_bytes]
              properties:
                filename:
                  type: string
                content_type:
                  type: string
                  example: image/jpeg
                size_bytes:
                  type: integer
                  format: int64
                  maximum: 26214400
      responses:
        '201':
          description: Pre-signed upload target
          content:
            application/json:
              schema:
                type: object
                required: [media_id, object_key, upload_url, file_url, expires_at]
                properties:
                  media_id:
                    type: string
                    format: uuid
                  object_key:
                    type: string
                    description: >
                      Storage key to reference in a message `content` (media
                      messages) or a group `avatar_url`.
                  upload_url:
                    type: string
                    format: uri
                    description: >
                      Short-lived presigned PUT. Upload the bytes with the exact
                      `Content-Type` and `Content-Length` declared here.
                  file_url:
                    type: string
                    format: uri
                  content_type:
                    type: string
                  size_bytes:
                    type: integer
                    format: int64
                  expires_at:
                    type: string
                    format: date-time
        '413':
          description: File exceeds the 25 MB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content type not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/media/{key}:
    get:
      tags: [Media]
      summary: Resolve a media object to a short-lived download URL
      description: >
        Redirects (302) to a presigned GET. Allowed for the owner and for users
        who share a conversation with the owner.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: Object key returned by `POST /media/presign`
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: >
            Access token for image/download handlers that cannot set an
            `Authorization` header. A bearer header is preferred when possible.
      responses:
        '302':
          description: Redirect to the presigned download URL
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/presence/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Presence]
      summary: Current online state and last-seen time for a user
      description: >
        Online state is a Redis key with a 45 s TTL refreshed by the gateway
        heartbeat; `last_seen_at` is persisted when the user's last device
        disconnects. Live changes after this call arrive as `presence` frames on
        the WebSocket.
      responses:
        '200':
          description: Presence snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Presence'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/search:
    get:
      tags: [Search]
      summary: Full-text search across every conversation the caller belongs to
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchLimit'
        - $ref: '#/components/parameters/SearchBeforeSeq'
      responses:
        '200':
          description: Ranked search hits, best match first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/conversations/{id}/search:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Search]
      summary: Full-text search inside one conversation
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchLimit'
        - $ref: '#/components/parameters/SearchBeforeSeq'
      responses:
        '200':
          description: Ranked search hits within the conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/keys:
    post:
      tags: [Encryption]
      summary: Publish this device's public encryption keys
      description: >
        Publishes the identity key, the Ed25519 signing key, one signed prekey,
        and up to 200 one-time prekeys. Only public material is accepted; the
        server never receives a private key. Re-publishing the identity key
        rotates it (peers see a new safety number). Re-uploading the same
        one-time prekey ids is a no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishKeysRequest'
      responses:
        '201':
          description: Keys stored
          content:
            application/json:
              schema:
                type: object
                required: [one_time_prekeys]
                properties:
                  one_time_prekeys:
                    type: integer
                    description: Count stored after this upload; replenish when low
                  added:
                    type: integer
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/keys/prekeys:
    post:
      tags: [Encryption]
      summary: Top up one-time prekeys
      description: >
        Adds one-time prekeys without re-publishing the identity or signed
        prekey. Existing key ids are ignored, so a retried upload is safe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [one_time_prekeys]
              properties:
                one_time_prekeys:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    $ref: '#/components/schemas/OneTimePrekey'
      responses:
        '200':
          description: Prekeys added
          content:
            application/json:
              schema:
                type: object
                required: [added, one_time_prekeys]
                properties:
                  added:
                    type: integer
                  one_time_prekeys:
                    type: integer
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/keys/me:
    get:
      tags: [Encryption]
      summary: The caller's own public key status
      responses:
        '200':
          description: Published keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                  identity_key:
                    type: string
                  signing_key:
                    type: string
                  one_time_prekeys:
                    type: integer
                  updated_at:
                    type: string
                    format: date-time
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Encryption]
      summary: Fetch a prekey bundle to start an E2EE session
      description: >
        Returns the recipient's identity key, signing key, signed prekey with its
        signature, and one one-time prekey when available. A one-time prekey is
        **consumed** by this call (deleted atomically), so the response is
        per-caller and un-cacheable (`Cache-Control: no-store`). A null
        `one_time_prekey` means the supply is exhausted; the signed prekey alone
        still works.
      responses:
        '200':
          description: Prekey bundle
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrekeyBundle'
        '404':
          description: The user has not published encryption keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ConversationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SearchQuery:
      name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: >
        Search text. Uses PostgreSQL `websearch_to_tsquery` semantics, so quoted
        phrases, `or`, and a leading `-` for exclusion are supported.
    SearchLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    SearchBeforeSeq:
      name: before_seq
      in: query
      description: Return only messages with `seq` lower than this value
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    Unauthorized:
      description: Missing, expired or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Caller is not a member of this conversation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: invalid_credentials
            message:
              type: string
            details:
              type: object
              additionalProperties: true

    User:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        phone_or_email:
          type: string
          description: Only returned for the authenticated user
        name:
          type: string
        avatar_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Access token lifetime in seconds

    AuthResponse:
      type: object
      required: [user, access_token, refresh_token, expires_in]
      properties:
        user:
          $ref: '#/components/schemas/User'
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer

    RegisterRequest:
      type: object
      required: [phone_or_email, name, password]
      properties:
        phone_or_email:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [phone_or_email, password]
      properties:
        phone_or_email:
          type: string
        password:
          type: string

    Member:
      type: object
      required: [user, role]
      properties:
        user:
          $ref: '#/components/schemas/User'
        role:
          type: string
          enum: [admin, member]
        last_read_seq:
          type: integer
          format: int64
        joined_at:
          type: string
          format: date-time

    Conversation:
      type: object
      required: [id, type, members, unread_count, last_read_seq, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [direct, group]
        name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
          description: Group avatar object key (null for direct chats)
        created_by:
          type: string
          format: uuid
          nullable: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        last_message:
          allOf:
            - $ref: '#/components/schemas/Message'
          nullable: true
        last_read_seq:
          type: integer
          format: int64
        unread_count:
          type: integer
        created_at:
          type: string
          format: date-time

    CreateConversationRequest:
      type: object
      required: [type, member_ids]
      properties:
        type:
          type: string
          enum: [direct, group]
        name:
          type: string
          description: Required for groups
          maxLength: 100
        avatar_url:
          type: string
          nullable: true
          description: Optional group avatar object key
        member_ids:
          type: array
          minItems: 1
          maxItems: 499
          items:
            type: string
            format: uuid

    Message:
      type: object
      required: [id, conversation_id, seq, sender_id, client_msg_id, type, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
        sender_id:
          type: string
          format: uuid
        client_msg_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [text, image, file]
        content:
          type: string
          description: Text body, or the media URL/ID for image and file messages
        created_at:
          type: string
          format: date-time

    MessagePage:
      type: object
      required: [messages, has_more]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        has_more:
          type: boolean

    SyncResponse:
      type: object
      required: [messages, latest_seq]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: Ascending by seq
        latest_seq:
          type: integer
          format: int64
          description: Highest seq in the conversation; repeat sync when it exceeds the last returned message

    Presence:
      type: object
      required: [user_id, online]
      properties:
        user_id:
          type: string
          format: uuid
        online:
          type: boolean
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: Last disconnection time; null if the user has never disconnected

    SearchHit:
      allOf:
        - $ref: '#/components/schemas/Message'
        - type: object
          properties:
            rank:
              type: number
              format: double
              description: Relevance score from `ts_rank`; higher is a better match

    SearchResult:
      type: object
      required: [messages, has_more]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
          description: Ordered by rank descending, then seq descending
        has_more:
          type: boolean

    OneTimePrekey:
      type: object
      required: [key_id, public_key]
      properties:
        key_id:
          type: integer
          minimum: 1
        public_key:
          type: string
          description: Base64 X25519 public key

    PublishKeysRequest:
      type: object
      required: [identity_key, signing_key, signed_prekey]
      properties:
        identity_key:
          type: string
          description: Base64 X25519 identity public key
        signing_key:
          type: string
          description: Base64 Ed25519 public key that signs prekeys
        signed_prekey:
          type: object
          required: [key_id, public_key, signature]
          properties:
            key_id:
              type: integer
              minimum: 1
            public_key:
              type: string
            signature:
              type: string
              description: Ed25519 signature over the signed prekey bytes
        one_time_prekeys:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/OneTimePrekey'

    PrekeyBundle:
      type: object
      required: [user_id, identity_key, signing_key, signed_prekey, remaining_one_time_prekeys]
      properties:
        user_id:
          type: string
          format: uuid
        identity_key:
          type: string
        signing_key:
          type: string
        signed_prekey:
          type: object
          required: [key_id, public_key, signature]
          properties:
            key_id:
              type: integer
            public_key:
              type: string
            signature:
              type: string
        one_time_prekey:
          nullable: true
          description: Consumed by this fetch; null when the supply is exhausted
          type: object
          properties:
            key_id:
              type: integer
            public_key:
              type: string
        remaining_one_time_prekeys:
          type: integer

security:
  - bearerAuth: []
