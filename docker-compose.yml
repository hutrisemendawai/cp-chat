name: cp-chat

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cpchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpchat}
      POSTGRES_DB: ${POSTGRES_DB:-cpchat}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cpchat} -d ${POSTGRES_DB:-cpchat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Phase 4: durable, partitioned event log for inter-service fan-out.
  # Enabled per deployment with BROKER=kafka (default remains Redis Pub/Sub).
  # KRaft mode: one node acts as both broker and controller, no ZooKeeper.
  kafka:
    image: apache/kafka:3.9.0
    profiles: ["kafka"]
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED_HOST:-localhost}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-12}
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Phase 4: Cassandra-compatible wide-column store for the messages table.
  # Single node for local development; production runs a multi-node ring.
  scylla:
    image: scylladb/scylla:6.2
    profiles: ["scylla"]
    restart: unless-stopped
    command: ["--smp", "1", "--memory", "1G", "--overprovisioned", "1", "--developer-mode", "1"]
    ports:
      - "${SCYLLA_PORT:-9042}:9042"
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -E '^UN' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  # One-shot CQL schema bootstrap for the Scylla/Cassandra message store.
  scylla-init:
    image: scylladb/scylla:6.2
    profiles: ["scylla"]
    depends_on:
      scylla:
        condition: service_healthy
    volumes:
      - ./backend/migrations/cql:/cql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        for schema in /cql/*.cql; do
          echo "applying $$schema";
          cqlsh scylla 9042 -f "$$schema" || exit 1;
        done

  minio:
    image: elestio/minio@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cpchat}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cpchat-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: elestio/minio@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-cpchat} ${MINIO_ROOT_PASSWORD:-cpchat-secret} &&
        mc mb --ignore-existing local/${MINIO_BUCKET:-cp-chat-media} &&
        mc anonymous set none local/${MINIO_BUCKET:-cp-chat-media}

  # One-shot migration runner. Use `make migrate-up` / `make migrate-down`.
  # Not started by `docker compose up`; runs via the `tools` profile.
  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations
      - ./backend/scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/migrate.sh"]
    command: ["up"]
    environment:
      DATABASE_URL: ${MIGRATE_DATABASE_URL:-postgres://cpchat:cpchat@postgres:5432/cpchat?sslmode=disable}

  # Stateless REST API (auth, users, conversations, history, sync, media).
  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${SERVICE_DATABASE_URL:-postgres://cpchat:cpchat@postgres:5432/cpchat?sslmode=disable}
      REDIS_URL: ${SERVICE_REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      REST_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Object storage. The API signs URLs against the host the mobile client
      # can reach, while MinIO itself is addressed by service name internally.
      S3_ENDPOINT: ${SERVICE_S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${MINIO_BUCKET:-cp-chat-media}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-cpchat}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-cpchat-secret}
      S3_FORCE_PATH_STYLE: "true"
      # Stream media downloads through the API so a device only needs to reach
      # this service; set to false to redirect to presigned storage URLs.
      MEDIA_PROXY_DOWNLOAD: ${MEDIA_PROXY_DOWNLOAD:-true}
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-26214400}
      # Phase 2: shared 1-hour log buffer, served at /logs.
      LOG_BUFFER_ENABLED: ${LOG_BUFFER_ENABLED:-true}
      LOG_RETENTION_SECONDS: ${LOG_RETENTION_SECONDS:-3600}
      LOG_MAX_ENTRIES: ${LOG_MAX_ENTRIES:-5000}
      LOG_VIEWER_TOKEN: ${LOG_VIEWER_TOKEN:-}
      # Phase 4. Defaults keep the Phase 1-3 behaviour; see .env.example.
      BROKER: ${BROKER:-redis}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      MESSAGE_STORE: ${MESSAGE_STORE:-postgres}
      SCYLLA_CONTACT_POINTS: ${SCYLLA_CONTACT_POINTS:-scylla:9042}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Stateful realtime gateway (WebSocket termination + routing).
  gateway:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["node", "dist/gateway.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${SERVICE_DATABASE_URL:-postgres://cpchat:cpchat@postgres:5432/cpchat?sslmode=disable}
      REDIS_URL: ${SERVICE_REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      GATEWAY_PORT: 8081
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}
      # Phase 2: the gateway writes into the same log timeline as the API.
      LOG_BUFFER_ENABLED: ${LOG_BUFFER_ENABLED:-true}
      LOG_RETENTION_SECONDS: ${LOG_RETENTION_SECONDS:-3600}
      LOG_MAX_ENTRIES: ${LOG_MAX_ENTRIES:-5000}
      LOG_VIEWER_TOKEN: ${LOG_VIEWER_TOKEN:-}
      # Passed to both services so the media/log configuration is identical
      # across the stack; the gateway itself serves no media routes.
      MEDIA_PROXY_DOWNLOAD: ${MEDIA_PROXY_DOWNLOAD:-true}
      # Phase 4 realtime transport, async ingest, and graceful drain budget.
      BROKER: ${BROKER:-redis}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      GATEWAY_ASYNC_INGEST: ${GATEWAY_ASYNC_INGEST:-false}
      GATEWAY_DRAIN_TIMEOUT_MS: ${GATEWAY_DRAIN_TIMEOUT_MS:-30000}
      GATEWAY_NODE_ID: ${GATEWAY_NODE_ID:-}
      MESSAGE_STORE: ${MESSAGE_STORE:-postgres}
      SCYLLA_CONTACT_POINTS: ${SCYLLA_CONTACT_POINTS:-scylla:9042}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      # A rolling deploy sends SIGTERM; Docker's default 10 s would cut the
      # drain short, so allow the configured budget plus a margin.
      stop_grace_period: 60s
    ports:
      - "${GATEWAY_PUBLISHED_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  minio-data:
  kafka-data:
  scylla-data:
